<div>
  <h2>Lista de Usuarios desde la API 🌐</h2>
  <div style="text-align: center; margin-bottom: 25px;">
    <button routerLink="/user/create">➕ Añadir Nuevo Usuario</button>
  </div>

  @if (users()) {
    <ul>
      @for (user of users(); track user.id) {
        <li>
          <strong>{{ user.name }}</strong> <br>
          <small style="color: #64748b;">✉️ {{ user.email }} | 📞 {{ user.phone }}</small><br><br>
          <a [routerLink]="['/user', user.id]">🔍 Ver detalles completos</a>
        </li>
      } @empty {
        <li style="border-left-color: #ef4444;">No se encontraron usuarios. 🕵️‍♂️</li>
      }
    </ul>
  } @else {
    <p style="text-align: center;">Cargando datos de internet... ⏳</p>
  }
</div>
