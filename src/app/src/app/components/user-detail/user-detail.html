<div>
  @if (user()) {
    <h2>Detalles de: {{ user()?.name }} 👤</h2>

    <div class="detail-card" style="max-width: 500px; margin: 0 auto;">
      <p><strong>Email:</strong> {{ user()?.email }}</p>
      <p><strong>Teléfono:</strong> {{ user()?.phone }}</p>
      <p><strong>Sitio Web:</strong> {{ user()?.website }}</p>

      <div style="display: flex; gap: 15px; margin-top: 25px;">
        <button routerLink="/" style="background: #64748b;">⬅ Volver</button>
        <button [routerLink]="['/user/edit', user()?.id]" style="background: #f59e0b;">✏️ Editar</button>
        <button (click)="onDelete()" style="background: #ef4444;">🗑️ Eliminar</button>
      </div>
    </div>
  } @else {
    <p style="text-align: center;">Cargando detalles del usuario... ⏳</p>
  }
</div>
